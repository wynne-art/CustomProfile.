
name: Build CustomProfile

on:
  workflow_dispatch:
  push:
    paths:
      - 'CustomProfile-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract source
        run: |
          mkdir project
          unzip CustomProfile-Source.zip -d project

      - name: Build plugin
        working-directory: project
        run: mvn --batch-mode clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomProfile-Paper-26.2
          path: project/target/CustomProfile-1.0.0.jar
